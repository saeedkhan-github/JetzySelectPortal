name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *' # nightly 02:00 UTC, staging
  workflow_dispatch: # manual "Run workflow" button (staging); production is run locally only

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same Docker image as local dev -> local results == CI results (Node is preinstalled).
    container:
      image: mcr.microsoft.com/playwright:v1.59.0-noble
    env:
      HOME: /root # Firefox refuses to run when HOME is owned by another user
      TEST_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run Playwright tests
        run: npx playwright test
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Upload test results (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
